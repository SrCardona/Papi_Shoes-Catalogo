<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0D0D" />

    <!--
      Íconos, de mayor a menor prioridad. El navegador se queda con el primero
      que entienda: los modernos toman el SVG y lo dibujan nítido a cualquier
      tamaño; el .ico queda para los viejos y para la carpeta de favoritos.
      El `?v=` fuerza la recarga: el favicon se cachea con una insistencia que
      no cede ni recargando la página, y sin cambiar la ruta se seguiría viendo
      el ícono anterior. Al cambiar el dibujo, sube el número.
    -->
    <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=1" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1" />
    <link rel="manifest" href="/site.webmanifest?v=1" />

    <title>PAPI SHOES — El Templo de los Tenis</title>
    <meta name="description" content="Tenis originales con legit check documentado y una linea de sneakers de uso diario escogida par por par. Asesoria por WhatsApp y envios a toda Colombia." />
    <link rel="canonical" href="https://www.papishoes.shop/" />

    <!--
      Lo que ve WhatsApp al pegar un enlace. Es el canal por el que se mueve
      todo el negocio, asi que estas seis lineas deciden como se ve cada par
      que el dueno comparte. Las fichas de producto reemplazan estos valores
      por los suyos: las escribe `scripts/generar-fichas.mjs` al compilar,
      porque el robot de WhatsApp no ejecuta JavaScript y jamas veria lo que
      React cambie despues.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PAPI SHOES" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://www.papishoes.shop/" />
    <meta property="og:title" content="PAPI SHOES — El Templo de los Tenis" />
    <meta property="og:description" content="Mas que tenis, es cultura. Originales con legit check y sneakers de uso diario." />
    <meta property="og:image" content="https://www.papishoes.shop/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PAPI SHOES — El Templo de los Tenis" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.papishoes.shop/og.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
