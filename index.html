<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0D0D" />

    <!--
      Íconos, de mayor a menor prioridad. El navegador se queda con el primero
      que entienda: los modernos toman el SVG y lo dibujan nítido a cualquier
      tamaño; el .ico queda para los viejos y para la carpeta de favoritos.
      El `?v=` fuerza la recarga: el favicon se cachea con una insistencia que
      no cede ni recargando la página, y sin cambiar la ruta se seguiría viendo
      el ícono anterior. Al cambiar el dibujo, sube el número.
    -->
    <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=1" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1" />
    <link rel="manifest" href="/site.webmanifest?v=1" />

    <title>PAPI SHOES — El Templo de los Tenis en Medellín</title>
    <meta name="description" content="Tienda de tenis en Medellín con envíos a toda Colombia. Tenis originales y sneakers de uso diario escogidos par por par. Pide por WhatsApp." />
    <link rel="canonical" href="https://www.papishoes.shop/" />

    <!--
      Lo que ve WhatsApp al pegar un enlace. Es el canal por el que se mueve
      todo el negocio, asi que estas seis lineas deciden como se ve cada par
      que el dueno comparte. Las fichas de producto reemplazan estos valores
      por los suyos: las escribe `scripts/generar-fichas.mjs` al compilar,
      porque el robot de WhatsApp no ejecuta JavaScript y jamas veria lo que
      React cambie despues.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PAPI SHOES" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:url" content="https://www.papishoes.shop/" />
    <meta property="og:title" content="PAPI SHOES — El Templo de los Tenis en Medellín" />
    <meta property="og:description" content="Más que tenis, es cultura. Tenis originales y sneakers de uso diario. Envíos a toda Colombia." />
    <meta property="og:image" content="https://www.papishoes.shop/og.jpg?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PAPI SHOES — El Templo de los Tenis" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.papishoes.shop/og.jpg?v=2" />

    <!--
      Quién es la tienda, para Google y los buscadores con IA: nombre, contacto
      y zona de atención. Sin dirección física a propósito: se vende por
      WhatsApp y con entregas, no hay local abierto al público. Va en todas las
      páginas, porque las fichas y las secciones se copian de este archivo.
    -->
    <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"OnlineStore","@id":"https://www.papishoes.shop/#tienda","name":"PAPI SHOES","alternateName":"El Templo de los Tenis","url":"https://www.papishoes.shop/","logo":"https://www.papishoes.shop/apple-touch-icon.png","image":"https://www.papishoes.shop/og.jpg","description":"Tienda de tenis en Medellín con envíos a toda Colombia: tenis originales y sneakers de uso diario. Pedidos por WhatsApp.","telephone":"+573045961031","contactPoint":{"@type":"ContactPoint","telephone":"+573045961031","contactType":"customer service","availableLanguage":"es","areaServed":"CO"},"areaServed":[{"@type":"City","name":"Medellín"},{"@type":"City","name":"Bogotá"},{"@type":"Country","name":"Colombia"}],"sameAs":["https://www.instagram.com/papi_shoes1/","https://www.tiktok.com/@papi_shoes1"]},{"@type":"WebSite","@id":"https://www.papishoes.shop/#sitio","url":"https://www.papishoes.shop/","name":"PAPI SHOES","inLanguage":"es-CO","publisher":{"@id":"https://www.papishoes.shop/#tienda"}}]}</script>

  </head>

</html>
